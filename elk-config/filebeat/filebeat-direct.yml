filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /usr/share/filebeat/logs/application.log
  fields:
    environment: development
  fields_under_root: true
  # Parse JSON logs directly
  json.keys_under_root: true
  json.add_error_key: true

# Send directly to Elasticsearch
output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  index: "delight-account-service-%{+YYYY.MM.dd}"

# Setup template for custom index
setup.template.name: "delight-account-service"
setup.template.pattern: "delight-account-service-*"
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  # Rename conflicting service field
  - rename:
      fields:
        - from: "service"
          to: "app_service"
  # Parse timestamp
  - timestamp:
      field: timestamp
      layouts:
        - '2006-01-02T15:04:05.000Z'
      test:
        - '2025-10-18T12:00:00.000Z'

logging.level: info
logging.to_files: false
