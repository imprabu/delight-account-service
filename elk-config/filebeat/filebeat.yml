filebeat.inputs:
- type: log
  enabled: true
  paths:
    - /usr/share/filebeat/logs/application.log
  # Don't add extra fields
  fields_under_root: false
  # Parse JSON logs directly - each line is a separate JSON object
  json.keys_under_root: true
  json.add_error_key: true
  # Remove multiline configuration since each log entry is a single line JSON
  # multiline.pattern: '^\{'
  # multiline.negate: true
  # multiline.match: after

# Send to Logstash for processing
output.logstash:
  hosts: ["logstash:5044"]

# Disable processors that add extra fields
processors: []

logging.level: info
logging.to_files: false