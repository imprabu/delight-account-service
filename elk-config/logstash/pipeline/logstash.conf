input {
  beats {
    port => 5044
  }
}

filter {
  if [message] {
    # Parse the JSON message
    json {
      source => "message"
    }
    
    # Parse timestamp - handle both proper and malformed formats
    date {
      match => [ 
        "timestamp", 
        "yyyy-MM-dd'T'HH:mm:ss.SSS'Z'",
        "yyyy-MM-dd'T'HH:mm:ss.S'NZ'",
        "ISO8601"
      ]
      target => "@timestamp"
    }
    
    # Add service metadata
    mutate {
      add_field => { "service_name" => "delight-account-service" }
      rename => { "service" => "app_service" }
    }
    
    # Clean up all unwanted fields
    mutate {
      remove_field => [ 
        "agent", "ecs", "input", "log", "host", "environment",
        "service_name", "thread"
      ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "delight-account-service-%{+YYYY.MM.dd}"
  }
}