plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.6'
	id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.delight'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
    }
}
repositories {
	mavenCentral()
}
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// OpenAPI/Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
	implementation 'org.apache.kafka:kafka-streams'
	implementation 'org.liquibase:liquibase-core'
        implementation 'org.springframework.kafka:spring-kafka'
        implementation 'org.springframework.boot:spring-boot-starter-log4j2'
        implementation 'org.apache.logging.log4j:log4j-layout-template-json'
        implementation 'org.springframework.boot:spring-boot-starter-aop'
        implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
        // Jackson Hibernate module (Jakarta) to serialize JPA proxies safely
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate5-jakarta'
        // JobRunr for async processing with pub/sub and monitoring
        implementation 'org.jobrunr:jobrunr-spring-boot-3-starter:7.2.2'
        // Lettuce Redis client for JobRunr
        implementation 'io.lettuce:lettuce-core:6.8.1.RELEASE'
        // Commons Pool2 for Lettuce connection pooling
        implementation 'org.apache.commons:commons-pool2:2.11.1'
        compileOnly 'org.projectlombok:lombok'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
        // TiDB is MySQL compatible; use the MySQL driver to connect
        implementation 'com.mysql:mysql-connector-j:8.4.0'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'com.h2database:h2'
        testImplementation 'org.awaitility:awaitility:4.2.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('bootBuildImage') {
	builder = 'paketobuildpacks/builder-jammy-base:latest'
}
tasks.named('test') {
        useJUnitPlatform()
}

import org.apache.tools.ant.filters.ReplaceTokens

// Get environment from command line argument or system environment variable
def env = project.hasProperty('env') ? project.property('env') : (System.getenv('ENV') ?: 'staging')

// Support shorthand alias: "dl" -> "docker_local"
def resolvedEnv = (env == 'dl') ? 'docker_local' : env

logger.lifecycle("Using environment: ${env} (resolved: ${resolvedEnv})")

def envFile = file("envVariables_${resolvedEnv}")
def envProps = [:]

// Load environment variables from file
if (envFile.exists()) {
    logger.lifecycle("Loading environment variables from: ${envFile}")
    envFile.eachLine { line ->
        def parts = line.split('=', 2)
        if (parts.length == 2) envProps[parts[0]] = parts[1]
    }
}

// Override with any properties passed directly via command line
project.properties.each { key, value ->
    if (key.startsWith('env.')) {
        def envKey = key.substring(4)
        envProps[envKey] = value
        logger.lifecycle("Overriding ${envKey} from command line argument")
    }
}

// Apply environment variables to all tasks
allprojects {
    tasks.withType(JavaExec) {
        // Pass environment variables to all JavaExec tasks (including bootRun)
        environment envProps
    }
    
    tasks.withType(Test) {
        // Pass environment variables to all Test tasks
        environment envProps
    }
}

tasks.named('processResources') {
    filesMatching('application.properties') {
        filter(ReplaceTokens, tokens: envProps)
    }
    filesMatching('log4j2-spring.xml') {
        filter(ReplaceTokens, tokens: envProps)
    }
}

tasks.named('processTestResources') {
    filesMatching('application.properties') {
        filter(ReplaceTokens, tokens: envProps)
    }
    filesMatching('log4j2-spring.xml') {
        filter(ReplaceTokens, tokens: envProps)
    }
}

// Task to kill any process running on port 8080
task killPort8080 {
    doLast {
        def port = 8080
        def os = System.getProperty("os.name").toLowerCase()
        
        if (os.contains("mac") || os.contains("darwin")) {
            // macOS/Linux
            def processIds = new ByteArrayOutputStream()
            exec {
                commandLine 'lsof', '-ti', ":$port"
                standardOutput = processIds
                ignoreExitValue = true
            }
            def pids = processIds.toString().trim()
            if (pids) {
                logger.lifecycle("Killing process(es) on port $port: $pids")
                exec {
                    commandLine 'kill', '-9', pids.split('\n')[0]
                    ignoreExitValue = true
                }
                // Wait a moment for the port to be released
                sleep(1000)
            } else {
                logger.lifecycle("No process found on port $port")
            }
        } else if (os.contains("win")) {
            // Windows
            def processIds = new ByteArrayOutputStream()
            exec {
                commandLine 'cmd', '/c', "netstat -ano | findstr :$port"
                standardOutput = processIds
                ignoreExitValue = true
            }
            def output = processIds.toString().trim()
            if (output) {
                def lines = output.split('\n')
                lines.each { line ->
                    def parts = line.trim().split('\\s+')
                    if (parts.length > 0) {
                        def pid = parts.last()
                        logger.lifecycle("Killing process on port $port: $pid")
                        exec {
                            commandLine 'taskkill', '/F', '/PID', pid
                            ignoreExitValue = true
                        }
                    }
                }
                sleep(1000)
            } else {
                logger.lifecycle("No process found on port $port")
            }
        } else {
            // Linux
            def processIds = new ByteArrayOutputStream()
            exec {
                commandLine 'lsof', '-ti', ":$port"
                standardOutput = processIds
                ignoreExitValue = true
            }
            def pids = processIds.toString().trim()
            if (pids) {
                logger.lifecycle("Killing process(es) on port $port: $pids")
                exec {
                    commandLine 'kill', '-9', pids.split('\n')[0]
                    ignoreExitValue = true
                }
                sleep(1000)
            } else {
                logger.lifecycle("No process found on port $port")
            }
        }
    }
}

// Configure bootRun task specifically
tasks.named('bootRun') {
    // Kill any process on port 8080 before starting
    dependsOn killPort8080
    
    // Ensure bootRun gets the environment variables
    environment envProps
    
    // Allow passing system properties to the application
    systemProperties = System.properties.findAll { key, value ->
        key.startsWith("app.")
    }.collectEntries { key, value ->
        [(key.substring(4)): value]
    }
}
