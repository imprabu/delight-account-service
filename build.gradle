plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.6'
	id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.delight'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
    }
}
repositories {
	mavenCentral()
}
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.apache.kafka:kafka-streams'
	implementation 'org.liquibase:liquibase-core'
        implementation 'org.springframework.kafka:spring-kafka'
        implementation 'org.springframework.boot:spring-boot-starter-log4j2'
        implementation 'org.springframework.boot:spring-boot-starter-aop'
        implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
        compileOnly 'org.projectlombok:lombok'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
        // TiDB is MySQL compatible; use the MySQL driver to connect
        implementation 'com.mysql:mysql-connector-j:8.4.0'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'com.h2database:h2'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('bootBuildImage') {
	builder = 'paketobuildpacks/builder-jammy-base:latest'
}
tasks.named('test') {
        useJUnitPlatform()
}

import org.apache.tools.ant.filters.ReplaceTokens

// Get environment from command line argument or system environment variable
def env = project.hasProperty('env') ? project.property('env') : (System.getenv('ENV') ?: 'staging')

// Support shorthand alias: "dl" -> "docker_local"
def resolvedEnv = (env == 'dl') ? 'docker_local' : env

logger.lifecycle("Using environment: ${env} (resolved: ${resolvedEnv})")

def envFile = file("envVariables_${resolvedEnv}")
def envProps = [:]

// Load environment variables from file
if (envFile.exists()) {
    logger.lifecycle("Loading environment variables from: ${envFile}")
    envFile.eachLine { line ->
        def parts = line.split('=', 2)
        if (parts.length == 2) envProps[parts[0]] = parts[1]
    }
}

// Override with any properties passed directly via command line
project.properties.each { key, value ->
    if (key.startsWith('env.')) {
        def envKey = key.substring(4)
        envProps[envKey] = value
        logger.lifecycle("Overriding ${envKey} from command line argument")
    }
}

// Apply environment variables to all tasks
allprojects {
    tasks.withType(JavaExec) {
        // Pass environment variables to all JavaExec tasks (including bootRun)
        environment envProps
    }
    
    tasks.withType(Test) {
        // Pass environment variables to all Test tasks
        environment envProps
    }
}

tasks.named('processResources') {
    filesMatching('application.properties') {
        filter(ReplaceTokens, tokens: envProps)
    }
    filesMatching('log4j2-spring.xml') {
        filter(ReplaceTokens, tokens: envProps)
    }
}

tasks.named('processTestResources') {
    filesMatching('application.properties') {
        filter(ReplaceTokens, tokens: envProps)
    }
    filesMatching('log4j2-spring.xml') {
        filter(ReplaceTokens, tokens: envProps)
    }
}

// Configure bootRun task specifically
tasks.named('bootRun') {
    // Ensure bootRun gets the environment variables
    environment envProps
    
    // Allow passing system properties to the application
    systemProperties = System.properties.findAll { key, value ->
        key.startsWith("app.")
    }.collectEntries { key, value ->
        [(key.substring(4)): value]
    }
}
