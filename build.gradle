plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.6'
	id 'io.spring.dependency-management' version '1.1.7'
}
group = 'com.delight'
version = '0.0.1-SNAPSHOT'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
    }
}
repositories {
	mavenCentral()
}
dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// OpenAPI/Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
	implementation 'org.apache.kafka:kafka-streams'
	implementation 'org.liquibase:liquibase-core'
        implementation 'org.springframework.kafka:spring-kafka'
        implementation 'org.springframework.boot:spring-boot-starter-log4j2'
        implementation 'org.apache.logging.log4j:log4j-layout-template-json'
        implementation 'org.springframework.boot:spring-boot-starter-aop'
        implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
        runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
        runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
        // Jackson Hibernate module (Jakarta) to serialize JPA proxies safely
        implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate5-jakarta'
        // JobRunr for async processing with pub/sub and monitoring
        implementation 'org.jobrunr:jobrunr-spring-boot-3-starter:7.2.2'
        // Lettuce Redis client for JobRunr
        implementation 'io.lettuce:lettuce-core:6.8.1.RELEASE'
        // Commons Pool2 for Lettuce connection pooling
        implementation 'org.apache.commons:commons-pool2:2.11.1'
        // Casbin for authorization
        implementation 'org.casbin:jcasbin:1.40.0'
        // SendGrid for email notifications
        implementation 'com.sendgrid:sendgrid-java:4.10.1'
        compileOnly 'org.projectlombok:lombok'
        developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
        // TiDB is MySQL compatible; use the MySQL driver to connect
        implementation 'com.mysql:mysql-connector-j:8.4.0'
	implementation 'org.postgresql:postgresql'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
        testImplementation 'org.springframework.security:spring-security-test'
        testImplementation 'com.h2database:h2'
        testImplementation 'org.awaitility:awaitility:4.2.0'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('bootBuildImage') {
	builder = 'paketobuildpacks/builder-jammy-base:latest'
}
tasks.named('test') {
        useJUnitPlatform()
}

import org.apache.tools.ant.filters.ReplaceTokens

// Get environment from command line argument or system environment variable
def env = project.hasProperty('env') ? project.property('env') : (System.getenv('ENV') ?: 'staging')

// Support shorthand alias: "dl" -> "docker_local"
def resolvedEnv = (env == 'dl') ? 'docker_local' : env

logger.lifecycle("Using environment: ${env} (resolved: ${resolvedEnv})")

def envFile = file("envVariables_${resolvedEnv}")
def envProps = [:]

// Load environment variables from file
if (envFile.exists()) {
    logger.lifecycle("Loading environment variables from: ${envFile}")
    envFile.eachLine { line ->
        def parts = line.split('=', 2)
        if (parts.length == 2) envProps[parts[0]] = parts[1]
    }
}

// Load additional environment variables from sendgrid.env if it exists
def sendgridEnvFile = file("sendgrid.env")
if (sendgridEnvFile.exists()) {
    logger.lifecycle("Loading additional environment variables from: ${sendgridEnvFile}")
    sendgridEnvFile.eachLine { line ->
        // Handle both "export KEY='value'" and "KEY=value" formats
        def trimmedLine = line.trim()
        if (trimmedLine.startsWith("export ")) {
            trimmedLine = trimmedLine.substring(7) // Remove "export "
        }
        def parts = trimmedLine.split('=', 2)
        if (parts.length == 2) {
            def key = parts[0].trim()
            def value = parts[1].trim()
            // Remove surrounding quotes if present
            if ((value.startsWith("'") && value.endsWith("'")) || 
                (value.startsWith('"') && value.endsWith('"'))) {
                value = value.substring(1, value.length() - 1)
            }
            envProps[key] = value
            logger.lifecycle("  Loaded: ${key}")
        }
    }
}

// Override with any properties passed directly via command line
project.properties.each { key, value ->
    if (key.startsWith('env.')) {
        def envKey = key.substring(4)
        envProps[envKey] = value
        logger.lifecycle("Overriding ${envKey} from command line argument")
    }
}

// Apply environment variables to all tasks
allprojects {
    tasks.withType(JavaExec) {
        // Pass environment variables to all JavaExec tasks (including bootRun)
        environment envProps
    }
    
    tasks.withType(Test) {
        // Pass environment variables to all Test tasks
        environment envProps
    }
}

tasks.named('processResources') {
    filesMatching('application.properties') {
        filter(ReplaceTokens, tokens: envProps)
    }
    filesMatching('log4j2-spring.xml') {
        filter(ReplaceTokens, tokens: envProps)
    }
}

tasks.named('processTestResources') {
    filesMatching('application.properties') {
        filter(ReplaceTokens, tokens: envProps)
    }
    filesMatching('log4j2-spring.xml') {
        filter(ReplaceTokens, tokens: envProps)
    }
}

// Task to kill any process running on port 8080
task killPort8080 {
    doLast {
        def port = 8080
        def os = System.getProperty("os.name").toLowerCase()
        
        if (os.contains("mac") || os.contains("darwin")) {
            // macOS/Linux
            def processIds = new ByteArrayOutputStream()
            exec {
                commandLine 'lsof', '-ti', ":$port"
                standardOutput = processIds
                ignoreExitValue = true
            }
            def pids = processIds.toString().trim()
            if (pids) {
                logger.lifecycle("Killing process(es) on port $port: $pids")
                exec {
                    commandLine 'kill', '-9', pids.split('\n')[0]
                    ignoreExitValue = true
                }
                // Wait a moment for the port to be released
                sleep(1000)
            } else {
                logger.lifecycle("No process found on port $port")
            }
        } else if (os.contains("win")) {
            // Windows
            def processIds = new ByteArrayOutputStream()
            exec {
                commandLine 'cmd', '/c', "netstat -ano | findstr :$port"
                standardOutput = processIds
                ignoreExitValue = true
            }
            def output = processIds.toString().trim()
            if (output) {
                def lines = output.split('\n')
                lines.each { line ->
                    def parts = line.trim().split('\\s+')
                    if (parts.length > 0) {
                        def pid = parts.last()
                        logger.lifecycle("Killing process on port $port: $pid")
                        exec {
                            commandLine 'taskkill', '/F', '/PID', pid
                            ignoreExitValue = true
                        }
                    }
                }
                sleep(1000)
            } else {
                logger.lifecycle("No process found on port $port")
            }
        } else {
            // Linux
            def processIds = new ByteArrayOutputStream()
            exec {
                commandLine 'lsof', '-ti', ":$port"
                standardOutput = processIds
                ignoreExitValue = true
            }
            def pids = processIds.toString().trim()
            if (pids) {
                logger.lifecycle("Killing process(es) on port $port: $pids")
                exec {
                    commandLine 'kill', '-9', pids.split('\n')[0]
                    ignoreExitValue = true
                }
                sleep(1000)
            } else {
                logger.lifecycle("No process found on port $port")
            }
        }
    }
}

// Frontend build tasks
def frontendDir = file('frontend')
def frontendBuildDir = file('frontend/build')
def frontendPackageJson = file('frontend/package.json')

// Check if frontend directory and package.json exist
// Make it a project property so it's accessible in all tasks
project.ext.hasFrontend = frontendDir.exists() && frontendDir.isDirectory() && frontendPackageJson.exists()

if (project.ext.hasFrontend) {
    // Task to install frontend dependencies
    task npmInstall(type: Exec) {
        description = 'Install frontend dependencies'
        group = 'build'
        workingDir = frontendDir
        commandLine = ['npm', 'install']
        
        // Only run if package.json exists and node_modules doesn't exist or package.json is newer
        inputs.file('frontend/package.json')
        outputs.dir('frontend/node_modules')
        
        // Don't ignore exit value - fail build if npm install fails
        ignoreExitValue = false
        
        // Provide helpful error message if npm is not found
        doFirst {
            try {
                exec {
                    commandLine = ['npm', '--version']
                    ignoreExitValue = false
                }
            } catch (Exception e) {
                throw new GradleException(
                    "npm is not installed or not in PATH. " +
                    "Please install Node.js and npm to build the frontend. " +
                    "You can skip frontend build by running: ./gradlew build -x npmBuild"
                )
            }
        }
    }

    // Task to build frontend
    task npmBuild(type: Exec) {
        description = 'Build frontend application'
        group = 'build'
        workingDir = frontendDir
        commandLine = ['npm', 'run', 'build']
        
        // Depend on npm install
        dependsOn npmInstall
        
        // Only run if source files changed
        inputs.dir('frontend/src')
        inputs.file('frontend/package.json')
        inputs.file('frontend/vite.config.ts')
        inputs.file('frontend/index.html')
        outputs.dir('frontend/build')
        
        // Don't ignore exit value - fail build if npm build fails
        ignoreExitValue = false
        
        // Log build output
        standardOutput = new java.io.ByteArrayOutputStream()
        errorOutput = new java.io.ByteArrayOutputStream()
        
        doLast {
            def output = standardOutput.toString()
            if (output) {
                logger.lifecycle("Frontend build output:\n${output}")
            }
            def error = errorOutput.toString()
            if (error) {
                logger.error("Frontend build errors:\n${error}")
            }
        }
    }

    // Make the main build task depend on frontend build
    // This ensures frontend is built whenever you run ./gradlew build
    tasks.named('build') {
        dependsOn npmBuild
        logger.lifecycle("✓ Frontend build (npmBuild) will run automatically as part of 'build' task")
    }

    // Make the bootJar task depend on frontend build (for creating the JAR with frontend)
    // This ensures frontend is built when creating the executable JAR
    tasks.named('bootJar') {
        dependsOn npmBuild
        logger.lifecycle("✓ Frontend build (npmBuild) will run automatically as part of 'bootJar' task")
    }
    
    // Make the jar task also depend on frontend build (for regular JAR creation)
    tasks.named('jar') {
        dependsOn npmBuild
    }
    
    // Clean task should also clean frontend build directory
    tasks.named('clean') {
        doLast {
            if (frontendBuildDir.exists()) {
                logger.lifecycle("Cleaning frontend build directory: {}", frontendBuildDir.absolutePath)
                delete frontendBuildDir
            }
        }
    }
    
    logger.lifecycle("✅ Frontend build automation configured:")
    logger.lifecycle("   - 'build' task: automatically runs npmInstall → npmBuild")
    logger.lifecycle("   - 'bootJar' task: automatically runs npmInstall → npmBuild")
    logger.lifecycle("   - 'bootRun' task: automatically runs npmInstall → npmBuild before starting")
    logger.lifecycle("   - 'clean' task: removes frontend/build directory")
} else {
    logger.lifecycle("Frontend directory or package.json not found. Skipping frontend build tasks.")
}

// Configure bootRun task specifically
tasks.named('bootRun') {
    // Kill any process on port 8080 before starting
    dependsOn killPort8080
    
    // Build frontend before running to ensure it's ready when app opens in browser
    if (project.ext.hasFrontend) {
        dependsOn npmBuild
    }
    
    // Ensure bootRun gets the environment variables
    environment envProps
    
    // Allow passing system properties to the application
    systemProperties = System.properties.findAll { key, value ->
        key.startsWith("app.")
    }.collectEntries { key, value ->
        [(key.substring(4)): value]
    }
    
    // Verify frontend build exists before starting (npmBuild dependency runs first, then we verify)
    doFirst {
        if (project.ext.hasFrontend) {
            // npmBuild dependency will have run by this point
            def buildDir = file('frontend/build')
            if (!buildDir.exists() || !buildDir.isDirectory()) {
                throw new GradleException(
                    "Frontend build directory does not exist: ${buildDir.absolutePath}\n" +
                    "The npmBuild task should have created this. Please check the build output for errors."
                )
            }
            def indexHtml = file('frontend/build/index.html')
            if (!indexHtml.exists()) {
                throw new GradleException(
                    "Frontend index.html not found: ${indexHtml.absolutePath}\n" +
                    "Frontend build may have failed. Please check the npm build output."
                )
            }
            logger.lifecycle("✅ Frontend build verified. Starting Spring Boot application...")
        }
    }
}
