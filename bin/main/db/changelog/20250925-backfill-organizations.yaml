databaseChangeLog:
  - changeSet:
      id: 20250925-backfill-organizations
      author: codex
      changes:
        - sql:
            dbms: mysql, mariadb
            sql: |
              -- Create an organization per account (if missing), keyed by domain
              INSERT INTO organizations(name, primary_domain, status)
              SELECT a.company_name, a.domain, 'ACTIVE'
              FROM accounts a
              LEFT JOIN organizations o ON o.primary_domain = a.domain
              WHERE a.organization_id IS NULL AND o.id IS NULL;
        - sql:
            dbms: mysql, mariadb
            sql: |
              -- Link accounts to their organization by matching domain
              UPDATE accounts a
              JOIN organizations o ON o.primary_domain = a.domain
              SET a.organization_id = o.id
              WHERE a.organization_id IS NULL;

