databaseChangeLog:
  - changeSet:
      id: 20250925-create-memberships
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: memberships
      changes:
        - createTable:
            tableName: memberships
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: invited_by
                  type: bigint
        - addUniqueConstraint:
            tableName: memberships
            columnNames: user_id, account_id
            constraintName: uq_memberships_user_account
        - addForeignKeyConstraint:
            baseTableName: memberships
            baseColumnNames: account_id
            referencedTableName: accounts
            referencedColumnNames: id
            constraintName: fk_memberships_account
            onDelete: CASCADE

