databaseChangeLog:
  - changeSet:
      id: 20250126-create-sessions
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: sessions
      changes:
        - createTable:
            tableName: sessions
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: jwt_token
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: user_agent
                  type: varchar(500)
              - column:
                  name: ip_address
                  type: varchar(45)
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: last_accessed_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false
        - createIndex:
            tableName: sessions
            indexName: idx_sessions_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: sessions
            indexName: idx_sessions_account_id
            columns:
              - column:
                  name: account_id
        - createIndex:
            tableName: sessions
            indexName: idx_sessions_expires_at
            columns:
              - column:
                  name: expires_at
        - createIndex:
            tableName: sessions
            indexName: idx_sessions_last_accessed_at
            columns:
              - column:
                  name: last_accessed_at