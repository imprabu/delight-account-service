databaseChangeLog:
  - changeSet:
      id: 20250127-add-sessions-missing-columns
      author: codex
      preConditions:
        - onFail: MARK_RAN
      changes:
        - addColumn:
            tableName: sessions
            columns:
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
                  defaultValue: 'MEMBER'
        - addColumn:
            tableName: sessions
            columns:
              - column:
                  name: session_id
                  type: varchar(255)
                  constraints:
                    nullable: false
        - addColumn:
            tableName: sessions
            columns:
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: sessions
            columnNames: session_id
            constraintName: uk_sessions_session_id
        - createIndex:
            tableName: sessions
            indexName: idx_sessions_session_id
            columns:
              - column:
                  name: session_id
        - sql:
            sql: "CREATE INDEX idx_sessions_jwt_token ON sessions(jwt_token(255))"
        - modifyDataType:
            tableName: sessions
            columnName: id
            newDataType: bigint
        - addAutoIncrement:
            tableName: sessions
            columnName: id
            columnDataType: bigint