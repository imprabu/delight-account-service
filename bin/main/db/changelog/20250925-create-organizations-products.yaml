databaseChangeLog:
  - changeSet:
      id: 20250925-create-organizations
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: organizations
      changes:
        - createTable:
            tableName: organizations
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: primary_domain
                  type: varchar(255)
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
  - changeSet:
      id: 20250925-create-products
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: products
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
        - addUniqueConstraint:
            tableName: products
            columnNames: code
            constraintName: uq_products_code
  - changeSet:
      id: 20250925-add-org-product-to-accounts
      author: codex
      changes:
        - addColumn:
            tableName: accounts
            columns:
              - column:
                  name: organization_id
                  type: bigint
              - column:
                  name: product_id
                  type: bigint

  - changeSet:
      id: 20250925-seed-hrms-product
      author: codex
      changes:
        - sql:
            dbms: mysql, mariadb
            sql: |
              INSERT INTO products(code, name, active)
              SELECT 'HRMS', 'HRMS', true
              WHERE NOT EXISTS (SELECT 1 FROM products WHERE code = 'HRMS');
  - changeSet:
      id: 20250925-backfill-product-on-accounts
      author: codex
      changes:
        - sql:
            dbms: mysql, mariadb
            sql: |
              UPDATE accounts a
              JOIN products p ON p.code = 'HRMS'
              SET a.product_id = p.id
              WHERE a.product_id IS NULL;

