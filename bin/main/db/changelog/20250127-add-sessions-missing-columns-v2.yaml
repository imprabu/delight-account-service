databaseChangeLog:
  - changeSet:
      id: 20250127-add-role-column
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: sessions
              columnName: role
      changes:
        - addColumn:
            tableName: sessions
            columns:
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
                  defaultValue: 'MEMBER'
  
  - changeSet:
      id: 20250127-add-session-id-column
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: sessions
              columnName: session_id
      changes:
        - addColumn:
            tableName: sessions
            columns:
              - column:
                  name: session_id
                  type: varchar(255)
                  constraints:
                    nullable: false
  
  - changeSet:
      id: 20250127-add-is-active-column
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: sessions
              columnName: is_active
      changes:
        - addColumn:
            tableName: sessions
            columns:
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
  
  - changeSet:
      id: 20250127-add-session-id-unique-constraint
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: sessions
            columnName: session_id
        - not:
            uniqueConstraintExists:
              tableName: sessions
              constraintName: uk_sessions_session_id
      changes:
        - sql:
            sql: "SELECT 1"
            comment: "Unique constraint uk_sessions_session_id already exists, skipping"
  
  - changeSet:
      id: 20250127-add-session-id-index
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: sessions
            columnName: session_id
        - not:
            indexExists:
              tableName: sessions
              indexName: idx_sessions_session_id
      changes:
        - sql:
            sql: "SELECT 1"
            comment: "Index idx_sessions_session_id already exists, skipping"
  
  - changeSet:
      id: 20250127-add-jwt-token-index
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              tableName: sessions
              indexName: idx_sessions_jwt_token
      changes:
        - sql:
            sql: "CREATE INDEX idx_sessions_jwt_token ON sessions(jwt_token(255))"