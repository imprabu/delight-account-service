databaseChangeLog:
  - changeSet:
      id: backfill-account-configs-rate-limiting
      author: system
      comment: Backfill account_configs table with default rate limiting configurations for existing accounts
      changes:
        - sql:
            comment: Insert default rate limiting configurations for all existing accounts
            sql: |
              INSERT INTO account_configs (account_id, config_type, config_data, is_active, created_at, updated_at)
              SELECT 
                a.id as account_id,
                'rate_limiting' as config_type,
                JSON_OBJECT(
                  'default.maxRequests', 600,
                  'default.windowSeconds', 60,
                  'api.maxRequests', 600,
                  'api.windowSeconds', 60,
                  'upload.maxRequests', 100,
                  'upload.windowSeconds', 60,
                  'download.maxRequests', 200,
                  'download.windowSeconds', 60
                ) as config_data,
                true as is_active,
                NOW() as created_at,
                NOW() as updated_at
              FROM accounts a
              WHERE NOT EXISTS (
                SELECT 1 FROM account_configs ac 
                WHERE ac.account_id = a.id 
                AND ac.config_type = 'rate_limiting' 
                AND ac.is_active = true
              );
      rollback:
        - sql:
            comment: Remove backfilled rate limiting configurations
            sql: |
              DELETE FROM account_configs 
              WHERE config_type = 'rate_limiting' 
              AND config_data = JSON_OBJECT(
                'default.maxRequests', 600,
                'default.windowSeconds', 60,
                'api.maxRequests', 600,
                'api.windowSeconds', 60,
                'upload.maxRequests', 100,
                'upload.windowSeconds', 60,
                'download.maxRequests', 200,
                'download.windowSeconds', 60
              );