databaseChangeLog:
  - changeSet:
      id: 20250128-create-account-configs
      author: codex
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: account_configs
      changes:
        - createTable:
            tableName: account_configs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: config_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: config_data
                  type: json
                  remarks: "JSON configuration data for flexible runtime settings"
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - createIndex:
            tableName: account_configs
            indexName: idx_account_configs_account_id
            columns:
              - column:
                  name: account_id
        - createIndex:
            tableName: account_configs
            indexName: idx_account_configs_type
            columns:
              - column:
                  name: config_type
        - createIndex:
            tableName: account_configs
            indexName: idx_account_configs_active
            columns:
              - column:
                  name: is_active