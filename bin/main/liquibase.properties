# Liquibase configuration for TiDB compatibility
# Disable reserved words checking since TiDB doesn't have information_schema.KEYWORDS
liquibase.database.reservedWords=
liquibase.shouldSnapshotData=false

# TiDB-specific database configuration
# Use MySQL dialect since TiDB is MySQL-compatible
liquibase.database.typeName=mysql

# Additional TiDB compatibility settings
liquibase.database.supportsSchemas=false
liquibase.database.supportsCatalogs=true
liquibase.database.caseSensitive=false