spring.application.name=account-service

## DB Config##
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

logging.level.root=INFO
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.liquibase.enabled=false
security.password.secret=1234567890123456
security.jwt.secret=sampleJwtSecret123sampleJwtSecret123
security.jwt.expiration=86400000

# Allow bean definition overriding for tests
spring.main.allow-bean-definition-overriding=true

# Redis configuration for tests (embedded or mock)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000ms

# Generous rate limits for tests to avoid 429
rate.limit.signup.max.requests=1000
rate.limit.signup.window.seconds=3600
rate.limit.signin.max.requests=1000
rate.limit.signin.window.seconds=3600
rate.limit.activation.max.requests=1000
rate.limit.activation.window.seconds=300
rate.limit.per.account.default.max.requests=1000
rate.limit.per.account.default.window.seconds=60

# Disable JobRunr background processing in tests (we'll process jobs synchronously)
org.jobrunr.background-job-server.enabled=false
org.jobrunr.dashboard.enabled=false

# Messaging service configuration for tests
messaging.service.base-url=http://localhost:8085
messaging.service.endpoint=/api/messages/ingest
messaging.service.jwt-token=test-token
messaging.topics.account-activities.topic-name=account_activities_v1
messaging.topics.account-activities.service-name=delight_accounts
