spring.application.name=account-service

## Docker Compose Config##
# Disable Spring Boot Docker Compose auto-startup since we're using Podman
spring.docker.compose.enabled=false

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties[spring.json.type.mapping]=accountEvent:com.delight.account.dto.AccountEventMessage,userEvent:com.delight.account.dto.UserEventMessage,membershipEvent:com.delight.account.dto.MembershipEventMessage
# IMPORTANT: Auto topic creation is disabled. Topics must be pre-created before application starts.
# Required topics: account_activities_v1, user_activities_v1, user_role_activities_v1
# To disable auto topic creation at broker level, set: auto.create.topics.enable=false

# Kafka Topic Names
kafka.topic.account-events=${KAFKA_TOPIC_ACCOUNT_EVENTS:account_activities_v1}
kafka.topic.user-events=${KAFKA_TOPIC_USER_EVENTS:user_activities_v1}
kafka.topic.user-role-events=${KAFKA_TOPIC_USER_ROLE_EVENTS:user_role_activities_v1}

## Server Config##
server.address=0.0.0.0
# Graceful shutdown - give time for connections to close
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Enable HTTP response compression (gzip) for static resources
server.compression.enabled=true
server.compression.mime-types=application/javascript,application/json,text/css,text/html,text/xml,text/plain,application/xml,image/svg+xml
server.compression.min-response-size=1024

# Static resource configuration
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=3600
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

## Actuator Config##
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

## DB Config##
# The service uses TiDB, which speaks the MySQL protocol, so the JDBC URL
# continues to use the `mysql` scheme.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:4000/delight-accounts?createDatabaseIfNotExist=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
security.password.secret=${PASSWORD_KEY:sampleSecretKey123}
security.jwt.secret=${JWT_SECRET:sampleJwtSecret123sampleJwtSecret123}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
logging.config=classpath:log4j2-spring.xml

#logging.level.root=DEBUG
#logging.level.org.springframework.orm.jpa=DEBUG
#logging.level.org.hibernate=DEBUG
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
# Ensure graceful shutdown to prevent thread warnings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
# Graceful shutdown configuration
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Disable Open Session In View to prevent database queries during view rendering
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.database-change-log-table=DATABASECHANGELOG
spring.liquibase.database-change-log-lock-table=DATABASECHANGELOGLOCK
spring.liquibase.drop-first=false
spring.liquibase.parameters.liquibase.database.reservedWords=
spring.liquibase.parameters.liquibase.shouldSnapshotData=false
spring.liquibase.parameters.liquibase.database.supportsSchemas=false
spring.liquibase.parameters.liquibase.database.supportsCatalogs=true
logging.level.liquibase=INFO
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email

## Redis Config##
# Account-service uses dedicated Redis databases to avoid collisions with other services
# Database 0: Reserved for other services
# Database 1: Casbin policy cache (per-account authorization policies)
# Database 2: account-service cache and rate limiting
# Database 3: JobRunr job queue
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:2}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:8}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:8}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:0}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:-1ms}

## Casbin Redis Config##
# Casbin policy cache uses Redis database 1
casbin.redis.database=${CASBIN_REDIS_DATABASE:1}

## Cache Config##
cache.default.ttl=${CACHE_DEFAULT_TTL:PT1H}
cache.account.ttl=${CACHE_ACCOUNT_TTL:PT30M}
cache.user.ttl=${CACHE_USER_TTL:PT15M}

## Rate Limiting Config##
rate.limit.signup.max.requests=${RATE_LIMIT_SIGNUP_MAX_REQUESTS:10}
rate.limit.signup.window.seconds=${RATE_LIMIT_SIGNUP_WINDOW_SECONDS:3600}
rate.limit.signin.max.requests=${RATE_LIMIT_SIGNIN_MAX_REQUESTS:20}
rate.limit.signin.window.seconds=${RATE_LIMIT_SIGNIN_WINDOW_SECONDS:3600}
rate.limit.activation.max.requests=${RATE_LIMIT_ACTIVATION_MAX_REQUESTS:5}
rate.limit.activation.window.seconds=${RATE_LIMIT_ACTIVATION_WINDOW_SECONDS:300}
rate.limit.default.per.account.max.requests=${RATE_LIMIT_DEFAULT_PER_ACCOUNT_MAX_REQUESTS:60}
rate.limit.default.per.account.window.seconds=${RATE_LIMIT_DEFAULT_PER_ACCOUNT_WINDOW_SECONDS:60}

# Session TTL configuration
session.ttl.hours=24

## Channel Authentication Config##
# Versioned shared private keys for channel JWT authentication
# Format: channel.auth.keys[version]={secret_key}
channel.auth.keys[v1]=${CHANNEL_AUTH_KEY_V1}
channel.auth.keys[v2]=${CHANNEL_AUTH_KEY_V2}

## Domain Configuration##
# Base domain name for tenant resolution (dev/docker: localhost, prod: delightapp)
app.domain.name=${APP_DOMAIN_NAME:localhost}

## JobRunr Async Worker Config##
# JobRunr uses dedicated Redis database 3 for job storage and coordination to avoid collisions
# Database 0-1: Reserved for other services
# Database 2: account-service cache and rate limiting
# Database 3: account-service JobRunr job queue
org.jobrunr.background-job-server.enabled=${JOBRUNR_BACKGROUND_JOB_SERVER_ENABLED:true}
app.jobrunr.redis.host=${JOBRUNR_REDIS_HOST:${REDIS_HOST:localhost}}
app.jobrunr.redis.port=${JOBRUNR_REDIS_PORT:${REDIS_PORT:6379}}
app.jobrunr.redis.password=${JOBRUNR_REDIS_PASSWORD:${REDIS_PASSWORD:}}
app.jobrunr.redis.database=${JOBRUNR_REDIS_DATABASE:3}
app.jobrunr.redis.connection-timeout=5000
app.jobrunr.redis.command-timeout=3000
app.jobrunr.redis.max-connections=8

# JobRunr Dashboard Configuration
app.jobrunr.dashboard.enabled=${JOBRUNR_DASHBOARD_ENABLED:true}
app.jobrunr.dashboard.port=${JOBRUNR_DASHBOARD_PORT:8000}
app.jobrunr.dashboard.username=${JOBRUNR_DASHBOARD_USERNAME:}
app.jobrunr.dashboard.password=${JOBRUNR_DASHBOARD_PASSWORD:}

# Email Notification Job Queue Configuration
app.jobrunr.email-notification.enabled=${JOBRUNR_EMAIL_NOTIFICATION_ENABLED:true}
app.jobrunr.email-notification.worker-count=5
app.jobrunr.email-notification.poll-interval-seconds=15
app.jobrunr.email-notification.delete-succeeded-jobs-after-hours=24
app.jobrunr.email-notification.permanently-delete-jobs-after-hours=72
app.jobrunr.email-notification.max-retries=3
app.jobrunr.email-notification.retry-delay-seconds=60

# Account Sync Job Queue Configuration
app.jobrunr.account-sync.enabled=${JOBRUNR_ACCOUNT_SYNC_ENABLED:true}
app.jobrunr.account-sync.worker-count=3
app.jobrunr.account-sync.poll-interval-seconds=15
app.jobrunr.account-sync.delete-succeeded-jobs-after-hours=24
app.jobrunr.account-sync.permanently-delete-jobs-after-hours=72
app.jobrunr.account-sync.max-retries=3
app.jobrunr.account-sync.retry-delay-seconds=60

# Cache Warmup Job Queue Configuration
app.jobrunr.cache-warmup.enabled=${JOBRUNR_CACHE_WARMUP_ENABLED:true}
app.jobrunr.cache-warmup.worker-count=2
app.jobrunr.cache-warmup.poll-interval-seconds=15
app.jobrunr.cache-warmup.delete-succeeded-jobs-after-hours=24
app.jobrunr.cache-warmup.permanently-delete-jobs-after-hours=72
app.jobrunr.cache-warmup.max-retries=3
app.jobrunr.cache-warmup.retry-delay-seconds=60

# Data Cleanup Job Queue Configuration
app.jobrunr.data-cleanup.enabled=${JOBRUNR_DATA_CLEANUP_ENABLED:true}
app.jobrunr.data-cleanup.worker-count=2
app.jobrunr.data-cleanup.poll-interval-seconds=15
app.jobrunr.data-cleanup.delete-succeeded-jobs-after-hours=24
app.jobrunr.data-cleanup.permanently-delete-jobs-after-hours=72
app.jobrunr.data-cleanup.max-retries=3
app.jobrunr.data-cleanup.retry-delay-seconds=60

# Account Event Publish Job Queue Configuration
app.jobrunr.account-event-publish.enabled=${JOBRUNR_ACCOUNT_EVENT_PUBLISH_ENABLED:true}
app.jobrunr.account-event-publish.worker-count=5
app.jobrunr.account-event-publish.poll-interval-seconds=15
app.jobrunr.account-event-publish.delete-succeeded-jobs-after-hours=24
app.jobrunr.account-event-publish.permanently-delete-jobs-after-hours=72
app.jobrunr.account-event-publish.max-retries=3
app.jobrunr.account-event-publish.retry-delay-seconds=60

# Bulk Account Sync Job Queue Configuration
app.jobrunr.bulk-account-sync.enabled=${JOBRUNR_BULK_ACCOUNT_SYNC_ENABLED:true}
app.jobrunr.bulk-account-sync.worker-count=2
app.jobrunr.bulk-account-sync.poll-interval-seconds=15
app.jobrunr.bulk-account-sync.delete-succeeded-jobs-after-hours=24
app.jobrunr.bulk-account-sync.permanently-delete-jobs-after-hours=72
app.jobrunr.bulk-account-sync.max-retries=3
app.jobrunr.bulk-account-sync.retry-delay-seconds=60

# User Event Publish Job Queue Configuration
app.jobrunr.user-event-publish.enabled=${JOBRUNR_USER_EVENT_PUBLISH_ENABLED:true}
app.jobrunr.user-event-publish.worker-count=5
app.jobrunr.user-event-publish.poll-interval-seconds=15
app.jobrunr.user-event-publish.delete-succeeded-jobs-after-hours=24
app.jobrunr.user-event-publish.permanently-delete-jobs-after-hours=72
app.jobrunr.user-event-publish.max-retries=3
app.jobrunr.user-event-publish.retry-delay-seconds=60

# Membership Event Publish Job Queue Configuration
app.jobrunr.membership-event-publish.enabled=${JOBRUNR_MEMBERSHIP_EVENT_PUBLISH_ENABLED:true}
app.jobrunr.membership-event-publish.worker-count=5
app.jobrunr.membership-event-publish.poll-interval-seconds=15
app.jobrunr.membership-event-publish.delete-succeeded-jobs-after-hours=24
app.jobrunr.membership-event-publish.permanently-delete-jobs-after-hours=72
app.jobrunr.membership-event-publish.max-retries=3
app.jobrunr.membership-event-publish.retry-delay-seconds=60



## Signup Configuration##
# Common email provider domains - if user signs up with these domains, use company name for account domain
# Comma-separated list of email provider domains (case-insensitive)
signup.common.email.providers=${SIGNUP_COMMON_EMAIL_PROVIDERS:gmail.com,yahoo.com,outlook.com,yandex.com,rediff.com,zoho.com}
