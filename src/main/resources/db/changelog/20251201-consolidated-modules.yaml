databaseChangeLog:
  - changeSet:
      id: 20251201-consolidated-modules-table
      author: codex
      comment: Consolidated modules table - TiDB compatible with AUTO_RANDOM
      changes:
        - sql:
            sql: DROP TABLE IF EXISTS modules
        - createTable:
            tableName: modules
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
                  remarks: Reference to accounts.id (FK not enforced in TiDB)
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
        - sql:
            sql: |
              -- Use TiDB AUTO_RANDOM for better scalability
              SET @@tidb_allow_remove_auto_inc = 1;
              ALTER TABLE modules MODIFY COLUMN id BIGINT AUTO_RANDOM(3);
              SET @@tidb_allow_remove_auto_inc = 0;
        - addUniqueConstraint:
            tableName: modules
            columnNames: account_id, name
            constraintName: uq_modules_account_name
        - createIndex:
            indexName: idx_modules_account_id
            tableName: modules
            columns:
              - column:
                  name: account_id

  - changeSet:
      id: 20251201-consolidated-field-definitions-table
      author: codex
      comment: Consolidated field_definitions table - TiDB compatible with AUTO_RANDOM
      changes:
        - sql:
            sql: DROP TABLE IF EXISTS field_definitions
        - createTable:
            tableName: field_definitions
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: module_id
                  type: bigint
                  constraints:
                    nullable: false
                  remarks: Reference to modules.id (FK not enforced in TiDB)
              - column:
                  name: field_key
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: field_label
                  type: varchar(100)
              - column:
                  name: field_type
                  type: varchar(50)
              - column:
                  name: is_required
                  type: boolean
              - column:
                  name: is_unique
                  type: boolean
        - sql:
            sql: |
              -- Use TiDB AUTO_RANDOM for better scalability
              SET @@tidb_allow_remove_auto_inc = 1;
              ALTER TABLE field_definitions MODIFY COLUMN id BIGINT AUTO_RANDOM(3);
              SET @@tidb_allow_remove_auto_inc = 0;
        - addUniqueConstraint:
            tableName: field_definitions
            columnNames: module_id, field_key
            constraintName: uq_field_definitions_module_key
        - createIndex:
            indexName: idx_field_definitions_module_id
            tableName: field_definitions
            columns:
              - column:
                  name: module_id

  - changeSet:
      id: 20251201-consolidated-module-data-table
      author: codex
      comment: Consolidated module_data table - TiDB compatible with AUTO_RANDOM
      changes:
        - sql:
            sql: DROP TABLE IF EXISTS module_data
        - createTable:
            tableName: module_data
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: module_id
                  type: bigint
                  constraints:
                    nullable: false
                  remarks: Reference to modules.id (FK not enforced in TiDB)
              - column:
                  name: data
                  type: json
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
        - sql:
            sql: |
              -- Use TiDB AUTO_RANDOM for better scalability
              SET @@tidb_allow_remove_auto_inc = 1;
              ALTER TABLE module_data MODIFY COLUMN id BIGINT AUTO_RANDOM(3);
              SET @@tidb_allow_remove_auto_inc = 0;
        - createIndex:
            indexName: idx_module_data_module_id
            tableName: module_data
            columns:
              - column:
                  name: module_id

  - changeSet:
      id: 20251201-consolidated-unique-field-values-table
      author: codex
      comment: Consolidated unique_field_values table - TiDB compatible with AUTO_RANDOM
      changes:
        - sql:
            sql: DROP TABLE IF EXISTS unique_field_values
        - createTable:
            tableName: unique_field_values
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: module_id
                  type: bigint
                  constraints:
                    nullable: false
                  remarks: Reference to modules.id (FK not enforced in TiDB)
              - column:
                  name: field_key
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: field_value
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: module_data_id
                  type: bigint
                  constraints:
                    nullable: false
                  remarks: Reference to module_data.id (FK not enforced in TiDB)
        - sql:
            sql: |
              -- Use TiDB AUTO_RANDOM for better scalability
              SET @@tidb_allow_remove_auto_inc = 1;
              ALTER TABLE unique_field_values MODIFY COLUMN id BIGINT AUTO_RANDOM(3);
              SET @@tidb_allow_remove_auto_inc = 0;
        - addUniqueConstraint:
            tableName: unique_field_values
            columnNames: module_id, field_key, field_value
            constraintName: uq_unique_field_value
        - createIndex:
            indexName: idx_unique_field_values_module_id
            tableName: unique_field_values
            columns:
              - column:
                  name: module_id
        - createIndex:
            indexName: idx_unique_field_values_module_data_id
            tableName: unique_field_values
            columns:
              - column:
                  name: module_data_id

