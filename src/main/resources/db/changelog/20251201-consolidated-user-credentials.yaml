databaseChangeLog:
  - changeSet:
      id: 20251201-consolidated-user-credentials-table
      author: codex
      comment: Consolidated user_credentials table - TiDB compatible with AUTO_RANDOM
      changes:
        - sql:
            sql: DROP TABLE IF EXISTS user_credentials
        - createTable:
            tableName: user_credentials
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_profile_id
                  type: bigint
                  constraints:
                    nullable: false
                  remarks: Reference to users.id (FK not enforced in TiDB)
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
                  remarks: Reference to accounts.id (FK not enforced in TiDB)
              - column:
                  name: password_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: api_key
                  type: varchar(255)
              - column:
                  name: updated_at
                  type: varchar(64)
                  remarks: Updated timestamp as string with nanosecond precision for versioning
        - sql:
            sql: |
              -- Use TiDB AUTO_RANDOM for better scalability
              SET @@tidb_allow_remove_auto_inc = 1;
              ALTER TABLE user_credentials MODIFY COLUMN id BIGINT AUTO_RANDOM(3);
              SET @@tidb_allow_remove_auto_inc = 0;
        - addUniqueConstraint:
            tableName: user_credentials
            columnNames: account_id, user_profile_id
            constraintName: uq_user_credentials_account_user
        - createIndex:
            indexName: idx_user_credentials_user_profile_id
            tableName: user_credentials
            columns:
              - column:
                  name: user_profile_id
        - createIndex:
            indexName: idx_user_credentials_account_id
            tableName: user_credentials
            columns:
              - column:
                  name: account_id

