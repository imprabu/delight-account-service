databaseChangeLog:
  - changeSet:
      id: migrate-sessions-to-auto-random
      author: system
      comment: Migrate sessions table from AUTO_INCREMENT to AUTO_RANDOM for better TiDB scalability
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: sessions
      changes:
        - sql:
            sql: "ALTER TABLE sessions MODIFY COLUMN id BIGINT AUTO_RANDOM(5);"
      rollback:
        - sql:
            sql: "ALTER TABLE sessions MODIFY COLUMN id BIGINT AUTO_INCREMENT;"