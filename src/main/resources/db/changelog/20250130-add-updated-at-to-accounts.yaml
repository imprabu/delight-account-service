databaseChangeLog:
  - changeSet:
      id: 20250130-add-updated-at-to-accounts
      author: system
      comment: "Add updated_at column to accounts table with microsecond precision (datetime(6))"
      changes:
        - addColumn:
            tableName: accounts
            columns:
              - column:
                  name: updated_at
                  type: datetime(6)
                  remarks: "Timestamp of last update with microsecond precision"

