databaseChangeLog:
  - changeSet:
      id: 20251201-remove-global-roles
      author: codex
      comment: Remove global roles (account_id IS NULL) as roles are now tenant-specific and created per account during signup
      changes:
        - sql:
            sql: |
              -- Delete role_privileges for global roles first (foreign key constraint)
              DELETE FROM role_privileges 
              WHERE role_id IN (SELECT id FROM roles WHERE account_id IS NULL);
              
              -- Delete global roles
              DELETE FROM roles WHERE account_id IS NULL;







