databaseChangeLog:
  - changeSet:
      id: migrate-account-configs-to-auto-random
      author: system
      comment: "Convert account_configs table id column from AUTO_INCREMENT to AUTO_RANDOM for improved TiDB scalability"
      changes:
        - sql:
            sql: "SET @@tidb_allow_remove_auto_inc = 1"
        - modifyDataType:
            tableName: account_configs
            columnName: id
            newDataType: BIGINT AUTO_RANDOM(3)
        - sql:
            sql: "SET @@tidb_allow_remove_auto_inc = 0"
      rollback:
        - sql:
            sql: "SET @@tidb_allow_remove_auto_inc = 1"
        - modifyDataType:
            tableName: account_configs
            columnName: id
            newDataType: BIGINT AUTO_INCREMENT
        - sql:
            sql: "SET @@tidb_allow_remove_auto_inc = 0"