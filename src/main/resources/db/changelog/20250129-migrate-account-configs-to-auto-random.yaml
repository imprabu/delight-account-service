databaseChangeLog:
  - changeSet:
      id: migrate-account-configs-to-auto-random
      author: system
      comment: Migrate account_configs table from AUTO_INCREMENT to AUTO_RANDOM for better TiDB scalability
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: account_configs
      changes:
        - sql:
            sql: "ALTER TABLE account_configs MODIFY COLUMN id BIGINT AUTO_RANDOM(5);"
      rollback:
        - sql:
            sql: "ALTER TABLE account_configs MODIFY COLUMN id BIGINT AUTO_INCREMENT;"