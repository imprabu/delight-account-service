databaseChangeLog:
  - changeSet:
      id: migrate-users-to-auto-random
      author: system
      comment: Migrate users table from AUTO_INCREMENT to AUTO_RANDOM for better TiDB scalability
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: users
      changes:
        - sql:
            sql: "ALTER TABLE users MODIFY COLUMN id BIGINT AUTO_RANDOM(5);"
      rollback:
        - sql:
            sql: "ALTER TABLE users MODIFY COLUMN id BIGINT AUTO_INCREMENT;"