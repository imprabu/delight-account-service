databaseChangeLog:
  - changeSet:
      id: 20251201-consolidated-users-table
      author: codex
      comment: Consolidated users table with all modifications - TiDB compatible with AUTO_RANDOM and partitioning
      changes:
        - sql:
            sql: DROP TABLE IF EXISTS users
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: bigint
                  remarks: Reference to accounts.id (FK not enforced in TiDB)
              - column:
                  name: user_name
                  type: varchar(255)
              - column:
                  name: dob
                  type: date
              - column:
                  name: email_address
                  type: varchar(255)
              - column:
                  name: language_pref
                  type: varchar(64)
              - column:
                  name: working_time_from
                  type: time
              - column:
                  name: working_time_to
                  type: time
              - column:
                  name: timezone
                  type: varchar(64)
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)
              - column:
                  name: company_name
                  type: varchar(255)
              - column:
                  name: phone_number
                  type: varchar(32)
              - column:
                  name: status
                  type: varchar(32)
                  defaultValue: 'INSERTED'
              - column:
                  name: updated_at
                  type: varchar(64)
                  remarks: Updated timestamp as string with nanosecond precision for versioning
        - sql:
            sql: |
              -- Use TiDB AUTO_RANDOM for better scalability
              SET @@tidb_allow_remove_auto_inc = 1;
              SET @@tidb_allow_remove_auto_inc = 1;
              ALTER TABLE users MODIFY COLUMN id BIGINT AUTO_RANDOM(3);
              SET @@tidb_allow_remove_auto_inc = 0;;
              SET @@tidb_allow_remove_auto_inc = 0;
        - addUniqueConstraint:
            tableName: users
            columnNames: account_id, email_address
            constraintName: uq_users_account_email
        - createIndex:
            indexName: idx_users_account_id
            tableName: users
            columns:
              - column:
                  name: account_id
        - createIndex:
            indexName: idx_users_email_address
            tableName: users
            columns:
              - column:
                  name: email_address
        - sql:
            sql: |
              -- Partition users table by account_id for better performance in TiDB
              ALTER TABLE users PARTITION BY KEY(account_id) PARTITIONS 4

