databaseChangeLog:
  - changeSet:
      id: migrate-memberships-to-auto-random
      author: system
      comment: Migrate memberships table from AUTO_INCREMENT to AUTO_RANDOM for better TiDB scalability
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: memberships
      changes:
        - sql:
            sql: "ALTER TABLE memberships MODIFY COLUMN id BIGINT AUTO_RANDOM(5);"
      rollback:
        - sql:
            sql: "ALTER TABLE memberships MODIFY COLUMN id BIGINT AUTO_INCREMENT;"