databaseChangeLog:
  - changeSet:
      id: 20251201-consolidated-account-configs-table
      author: codex
      comment: Consolidated account_configs table - TiDB compatible with AUTO_RANDOM
      changes:
        - sql:
            sql: DROP TABLE IF EXISTS account_configs
        - createTable:
            tableName: account_configs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: bigint
                  constraints:
                    nullable: false
                  remarks: Reference to accounts.id (FK not enforced in TiDB)
              - column:
                  name: config_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: config_data
                  type: json
                  remarks: JSON configuration data for flexible runtime settings
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: varchar(64)
                  remarks: Updated timestamp as string with nanosecond precision for versioning
              - column:
                  name: is_active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - sql:
            sql: |
              -- Use TiDB AUTO_RANDOM for better scalability
              SET @@tidb_allow_remove_auto_inc = 1;
              ALTER TABLE account_configs MODIFY COLUMN id BIGINT AUTO_RANDOM(3);
              SET @@tidb_allow_remove_auto_inc = 0;
        - createIndex:
            indexName: idx_account_configs_account_id
            tableName: account_configs
            columns:
              - column:
                  name: account_id
        - createIndex:
            indexName: idx_account_configs_type
            tableName: account_configs
            columns:
              - column:
                  name: config_type
        - createIndex:
            indexName: idx_account_configs_active
            tableName: account_configs
            columns:
              - column:
                  name: is_active

